<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Store DZ - Official Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --badge-discount: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            direction: rtl;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .store-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-nav-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .section-header {
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .section-subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .products-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            position: relative;
            overflow: hidden;
        }

        .discount-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ec4899, #ef4444);
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
        }

        .product-img-box {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .product-img-box img {
            max-height: 100%;
            object-fit: contain;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }

        .current-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }

        .old-price {
            font-size: 11px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        .in-stock {
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="header-top">
        <div class="store-title">FOX STORE 🇩🇿</div>
    </div>

    <div class="top-nav-buttons">
        <button class="nav-btn">📦 Track order</button>
        <button class="nav-btn">📐 Size guide</button>
        <button class="nav-btn">🔒 Admin</button>
    </div>

    <div class="section-header">
        <div class="section-title">All Jackets (3)</div>
        <div class="section-subtitle">Click any jacket to view</div>
    </div>

    <div class="products-container">
        <!-- المنتج الأول -->
        <div class="product-card" onclick="viewProduct('Black Jacket', '5,490 DA')">
            <div class="discount-badge">-21%</div>
            <div class="product-img-box">
                <span style="font-size: 50px;">🧥</span>
            </div>
            <div class="product-name">Black Jacket</div>
            <div class="price-row">
                <span class="current-price">5,490 DA</span>
                <span class="old-price">6,990 DA</span>
            </div>
            <div style="font-size: 11px; color: #eab308; margin-bottom: 4px;">⭐⭐⭐⭐⭐ (new)</div>
            <div class="product-meta">
                <span class="in-stock">● In stock</span>
                <span>👁️ Quick view</span>
            </div>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card" onclick="viewProduct('Blue Jacket', '4,990 DA')">
            <div class="discount-badge">-23%</div>
            <div class="product-img-box">
                <span style="font-size: 50px;">🧥</span>
            </div>
            <div class="product-name">Blue Jacket</div>
            <div class="price-row">
                <span class="current-price">4,990 DA</span>
                <span class="old-price">6,490 DA</span>
            </div>
            <div style="font-size: 11px; color: #eab308; margin-bottom: 4px;">⭐⭐⭐⭐⭐ (new)</div>
            <div class="product-meta">
                <span class="in-stock">● In stock</span>
                <span>👁️ Quick view</span>
            </div>
        </div>

        <!-- المنتج الثالث -->
        <div class="product-card" onclick="viewProduct('Green Jacket', '4,590 DA')">
            <div class="discount-badge">-18%</div>
            <div class="product-img-box">
                <span style="font-size: 50px;">🧥</span>
            </div>
            <div class="product-name">Green Puffer Jacket</div>
            <div class="price-row">
                <span class="current-price">4,590 DA</span>
                <span class="old-price">5,590 DA</span>
            </div>
            <div style="font-size: 11px; color: #eab308; margin-bottom: 4px;">⭐⭐⭐⭐⭐ (new)</div>
            <div class="product-meta">
                <span class="in-stock">● In stock</span>
                <span>👁️ Quick view</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function viewProduct(name, price) {
            if (tg) {
                tg.showAlert(`تم اختيار: ${name}\nالسعر: ${price}`);
            } else {
                alert(`تم اختيار: ${name}\nالسعر: ${price}`);
            }
        }
    </script>
</body>
</html>
