<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK STORE | متجر الأحذية 3D التفاعلي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0b0f19;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(18, 18, 24, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between">

  <header class="max-w-4xl mx-auto w-full p-4 flex justify-between items-center border-b border-white/10">
    <h1 class="text-xl font-black text-cyan-400">BLACK STORE 3D</h1>
    <div class="flex items-center gap-3">
      <button onclick="toggleCart()" class="relative p-2 bg-slate-900 border border-white/10 rounded-xl text-cyan-400 transition hover:bg-slate-800">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count" class="absolute -top-1 -right-1 bg-cyan-400 text-slate-950 text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
      <button onclick="openAdminModal()" class="px-3 py-1.5 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-xl text-xs font-bold transition hover:bg-cyan-500/20">لوحة الأدمن</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full p-4 flex-1">
    <div id="products-grid" class="space-y-6">
      <p class="text-cyan-400 text-xs text-center py-12 animate-pulse">جاري تحميل تشكيلة الأحذية من السحابة...</p>
    </div>
  </main>

  <section id="page-admin" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-md w-full p-6 rounded-3xl border border-white/20 relative shadow-2xl">
      <button onclick="closeAdminModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-lg font-bold text-white mb-4">إضافة حذاء 3D جديد</h3>
      <form id="add-product-form" onsubmit="handleCloudCreateProduct(event)" class="space-y-3">
        <input type="text" id="p-title" required placeholder="اسم الحذاء (مثال: نايك إير فورس)" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs outline-none focus:border-cyan-400">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="p-price" required placeholder="السعر (د.ج)" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs outline-none focus:border-cyan-400">
          <input type="text" id="p-category" required placeholder="التصنيف (مثال: رياضي)" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs outline-none focus:border-cyan-400">
        </div>
        <input type="url" id="p-glb-url" required placeholder="رابط مجسم الـ GLB المباشر (.glb)" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-white/10 text-white text-xs outline-none focus:border-cyan-400">
        <button type="submit" class="w-full py-3 bg-cyan-500 text-slate-950 font-bold rounded-xl text-xs transition hover:bg-cyan-400">نشر الحذاء في المتجر</button>
      </form>
    </div>
  </section>

  <div id="cart-drawer" class="fixed inset-y-0 left-0 w-full sm:w-80 glass-card z-50 transform -translate-x-full transition-transform duration-300 flex flex-col p-6 border-r border-white/10 shadow-2xl">
    <div class="flex items-center justify-between pb-4 border-b border-white/10">
      <h3 class="text-base font-bold text-white">سلة المشتريات</h3>
      <button onclick="toggleCart()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-3">
      <p class="text-slate-500 text-center text-xs py-8">السلة فارغة</p>
    </div>
    <div class="border-t border-white/10 pt-4 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-slate-400 text-xs">المجموع:</span>
        <span id="cart-total" class="text-base font-black text-cyan-400">0.00 د.ج</span>
      </div>
      <button class="w-full py-3 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs transition hover:bg-cyan-400">إتمام الطلب</button>
    </div>
  </div>
  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden"></div>

  <script>
    const SUPABASE_URL = 'https://qrikkoarqzqousgaorjm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyaWtrb2FycXpxb3VzZ2FvcmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODk3MzgsImV4cCI6MjEwNjM2NTczOH0.0QX8qkanTKe2iF1ALjtAT0L2t1P4N7WkmpDyMFAdKcg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let products = [];
    let cart = [];
    let quantities = {};

    async function fetchProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
      if (!error && data) {
        products = data;
        products.forEach(p => { if (!quantities[p.id]) quantities[p.id] = 1; });
        renderProducts();
      }
    }

    function openAdminModal() {
      const pass = prompt("أدخل كلمة المرور (admin123):");
      if (pass === "admin123") {
        document.getElementById('page-admin').classList.remove('hidden');
      } else if (pass !== null) {
        alert("كلمة المرور غير صحيحة!");
      }
    }

    function closeAdminModal() {
      document.getElementById('page-admin').classList.add('hidden');
    }

    async function handleCloudCreateProduct(e) {
      e.preventDefault();
      const newProduct = {
        title: document.getElementById('p-title').value,
        price: parseFloat(document.getElementById('p-price').value),
        category: document.getElementById('p-category').value,
        type: '3d',
        content: document.getElementById('p-glb-url').value
      };

      const { error } = await supabaseClient.from('products').insert([newProduct]);
      if (error) {
        alert('خطأ أثناء النشر: ' + error.message);
      } else {
        alert('تم نشر الحذاء بنجاح!');
        document.getElementById('add-product-form').reset();
        closeAdminModal();
        fetchProducts();
      }
    }

    function changeQty(id, delta) {
      if (!quantities[id]) quantities[id] = 1;
      quantities[id] += delta;
      if (quantities[id] < 1) quantities[id] = 1;
      document.getElementById(`qty-${id}`).innerText = quantities[id];
      renderProducts();
    }

    function changeShoeColor(id, hexColor) {
      const viewer = document.getElementById(`model-${id}`);
      if (!viewer) return;
      
      const material = viewer.model && viewer.model.materials[0];
      if (material) {
        material.pbrMetallicRoughness.setBaseColorFactor(hexColor);
      }
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      if (products.length === 0) {
        grid.innerHTML = `<p class="text-slate-400 text-xs text-center py-12">لا توجد أحذية معروضة حالياً.</p>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const qty = quantities[p.id] || 1;
        return `
          <div class="glass-card rounded-3xl p-5 flex flex-col md:flex-row items-center justify-between gap-6 border border-white/10 shadow-2xl">
            <div class="flex flex-col items-start gap-3 flex-1 w-full">
              <span class="bg-cyan-500/10 text-cyan-400 text-[10px] font-bold px-3 py-1 rounded-full border border-cyan-500/20">${p.category}</span>
              <h3 class="text-xl sm:text-2xl font-black text-white">${p.title}</h3>
              <p class="text-[11px] text-slate-400">تصميم ثلاثي الأبعاد تفاعلي 360 درجة</p>
              
              <div class="flex items-center gap-2.5 my-1">
                <button onclick="changeShoeColor(${p.id}, [0.9, 0.1, 0.1, 1])" class="w-5 h-5 rounded-full bg-red-500 border-2 border-white/40 hover:scale-110 transition shadow-md" title="أحمر"></button>
                <button onclick="changeShoeColor(${p.id}, [0.1, 0.1, 0.1, 1])" class="w-5 h-5 rounded-full bg-slate-900 border-2 border-white/40 hover:scale-110 transition shadow-md" title="أسود"></button>
                <button onclick="changeShoeColor(${p.id}, [0.1, 0.6, 0.9, 1])" class="w-5 h-5 rounded-full bg-cyan-500 border-2 border-white/40 hover:scale-110 transition shadow-md" title="أزرق"></button>
                <button onclick="changeShoeColor(${p.id}, [0.9, 0.9, 0.9, 1])" class="w-5 h-5 rounded-full bg-white border-2 border-white/40 hover:scale-110 transition shadow-md" title="أبيض"></button>
              </div>

              <div class="flex items-center gap-3 w-full sm:w-auto pt-2">
                <div class="flex items-center bg-slate-900 border border-white/10 rounded-xl p-1">
                  <button onclick="changeQty(${p.id}, -1)" class="w-7 h-7 flex items-center justify-center text-slate-300 font-bold hover:text-white">-</button>
                  <span id="qty-${p.id}" class="w-6 text-center text-xs font-bold text-white">${qty}</span>
                  <button onclick="changeQty(${p.id}, 1)" class="w-7 h-7 flex items-center justify-center text-slate-300 font-bold hover:text-white">+</button>
                </div>
                <button onclick="addToCart(${p.id})" class="flex-1 sm:flex-none px-5 py-2.5 bg-white hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg">
                  <span>أضف للسلة</span>
                  <span class="text-cyan-600 font-extrabold">${(p.price * qty).toFixed(0)} د.ج</span>
                </button>
              </div>
            </div>

            <div class="relative w-full sm:w-64 aspect-square bg-slate-950/60 rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center">
              <model-viewer 
                id="model-${p.id}"
                src="${p.content}" 
                camera-controls 
                auto-rotate 
                shadow-intensity="1"
                style="width: 100%; height: 100%;">
              </model-viewer>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const qty = quantities[id] || 1;
      const item = cart.find(i => i.id === id);
      if (item) { 
        item.qty += qty; 
      } else { 
        cart.push({ ...product, qty: qty }); 
      }
      updateCartUI();
      alert(`تمت إضافة ${qty} من ${product.title} إلى السلة بنجاح!`);
    }

    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const itemsContainer = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      countEl.innerText = totalCount;

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p class="text-slate-500 text-center text-xs py-8">السلة فارغة</p>`;
        totalEl.innerText = `0.00 د.ج`;
        return;
      }

      itemsContainer.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-white/5">
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-white truncate">${item.title}</h4>
            <span class="text-[10px] text-cyan-400">${item.price} د.ج × ${item.qty}</span>
          </div>
        </div>
      `).join('');

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      totalEl.innerText = `${totalPrice.toFixed(0)} د.ج`;
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      const overlay = document.getElementById('cart-overlay');
      const isOpen = !drawer.classList.contains('-translate-x-full');
      drawer.classList.toggle('-translate-x-full', isOpen);
      overlay.classList.toggle('hidden', isOpen);
    }

    fetchProducts();
  </script>
</body>
</html>
